<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Shuling Tang — 计算机视觉与图像色彩">
  <title>Shuling Tang — 计算机视觉与图像色彩</title>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="55%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#F6AD55"/>
    </linearGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="50%" stop-color="#4FD1C5"/>
      <stop offset="100%" stop-color="#F6AD55"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B7CFF" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FD1C5" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#4FD1C5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#FFFFFF" fill-opacity=".05"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="280" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="280" fill="#0D1117"/>
    <rect width="1200" height="280" fill="url(#dots)"/>
    <circle cx="1040" cy="30" r="270" fill="url(#glowA)"/>
    <circle cx="90" cy="300" r="250" fill="url(#glowB)"/>

    <!-- 色彩通道意象：三个半透明色环叠加，呼应色彩迁移 -->
    <g opacity=".92">
      <circle cx="975" cy="118" r="62" fill="#8B7CFF" fill-opacity=".20"/>
      <circle cx="1039" cy="118" r="62" fill="#4FD1C5" fill-opacity=".20"/>
      <circle cx="1007" cy="172" r="62" fill="#F6AD55" fill-opacity=".24"/>
      <circle cx="975" cy="118" r="62" fill="none" stroke="#8B7CFF" stroke-opacity=".45"/>
      <circle cx="1039" cy="118" r="62" fill="none" stroke="#4FD1C5" stroke-opacity=".45"/>
      <circle cx="1007" cy="172" r="62" fill="none" stroke="#F6AD55" stroke-opacity=".52"/>
    </g>
    <g>
      <circle cx="1007" cy="140" r="124" fill="none" stroke="url(#spectrum)" stroke-opacity=".38"
              stroke-width="1.5" stroke-dasharray="5 11" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate"
                          from="0 1007 140" to="360 1007 140" dur="60s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1007" cy="16" r="3" fill="#8B7CFF" fill-opacity=".8"/>
      <circle cx="1131" cy="140" r="2.5" fill="#4FD1C5" fill-opacity=".7"/>
    </g>

    <!-- 左侧文字 -->
    <rect x="72" y="84" width="4" height="112" rx="2" fill="url(#rail)"/>
    <text x="104" y="100" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
          font-size="13" letter-spacing="2.6" fill="#4FD1C5" fill-opacity=".95">COMPUTER VISION · IMAGE COLOR</text>
    <text x="104" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="52" font-weight="700" letter-spacing="-1" fill="#E6EDF3">Shuling Tang</text>
    <text x="104" y="186" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif"
          font-size="19" fill="#8B949E">把论文里的方法，做成真的能用的东西。</text>

    <!-- 标签 -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" text-anchor="middle">
      <rect x="104" y="210" width="142" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
      <text x="175" y="229" fill="#A5B4FC">Human Parsing</text>
      <rect x="258" y="210" width="150" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
      <text x="333" y="229" fill="#7FE3D8">Color Transfer</text>
      <rect x="420" y="210" width="132" height="30" rx="15" fill="#161B22" stroke="#30363D"/>
      <text x="486" y="229" fill="#F8C989">LLM Tooling</text>
    </g>
  </g>
  <rect x=".75" y=".75" width="1198.5" height="278.5" rx="16" fill="none" stroke="#30363D"/>
</svg>
