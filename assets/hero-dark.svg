<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-label="Shuling Tang — Generative Vision">
  <defs>
    <radialGradient id="g1"><stop offset="0" stop-color="#2DD4BF" stop-opacity="0.55"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2"><stop offset="0" stop-color="#7C8CFF" stop-opacity="0.45"/><stop offset="1" stop-color="#7C8CFF" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3"><stop offset="0" stop-color="#FFB08A" stop-opacity="0.45"/><stop offset="1" stop-color="#FFB08A" stop-opacity="0"/></radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Segoe UI",Helvetica,Arial,sans-serif}
      .m{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace}
      @keyframes d1{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-16px)}}
      @keyframes d2{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,20px)}}
      @keyframes d3{0%,100%{transform:translate(0,0)}50%{transform:translate(14px,18px)}}
      .b1{animation:d1 14s ease-in-out infinite}.b2{animation:d2 17s ease-in-out infinite}.b3{animation:d3 19s ease-in-out infinite}
      @media (prefers-reduced-motion:reduce){.b1,.b2,.b3{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="400" fill="#0d1117"/>
  <g stroke="#1c2230" stroke-width="1">
    <path d="M760 60V340M840 60V340M920 60V340M1000 60V340M1080 60V340M1160 60V340"/>
    <path d="M720 100H1200M720 180H1200M720 260H1200M720 340H1200"/>
  </g>
  <g filter="url(#blur)">
    <circle class="b1" cx="930" cy="150" r="170" fill="url(#g1)"/>
    <circle class="b2" cx="1060" cy="260" r="150" fill="url(#g2)"/>
    <circle class="b3" cx="860" cy="300" r="130" fill="url(#g3)"/>
  </g>
  <g class="t">
    <text x="88" y="128" font-size="13" letter-spacing="4" fill="#9aa0a6" font-weight="600">GENERATIVE VISION · IMAGE EDITING · DISTILLATION</text>
    <text x="86" y="208" font-size="64" font-weight="700" letter-spacing="-2" fill="#f5f5f7">Shuling Tang</text>
    <text x="88" y="252" font-size="20" fill="#9aa0a6">让扩散模型学会只改该改的地方。</text>
    <line x1="88" y1="284" x2="136" y2="284" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round"/>
    <g class="m" font-size="13" fill="#9aa0a6">
      <rect x="88" y="304" width="138" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="157" y="324" text-anchor="middle">diffusion</text>
      <rect x="236" y="304" width="186" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="329" y="324" text-anchor="middle">teacher → student</text>
      <rect x="432" y="304" width="150" height="30" rx="15" fill="#161b22" stroke="#30363d"/><text x="507" y="324" text-anchor="middle">agentic tools</text>
    </g>
  </g>
</svg>
